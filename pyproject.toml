[project]
name = "bluegate"
version = "1.0.0b2"
description = "Bluetooth Gateway & Device Manager"
authors = [{ name = "Sébastien Demanou", email = "demsking@gmail.com" }]
maintainers = [{ name = "Sébastien Demanou", email = "demsking@gmail.com" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
readme = "README.md"

keywords = [
  "bluetooth",
  "gateway",
  "device manager",
]

classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "fastapi[standard]>=0.115.0,<1.0.0",
  "uvicorn>=0.34.0,<1.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.14.2",
  "dbus-next>=0.2.3,<1.0.0",
]

[project.urls]
"Say Thanks!" = "https://www.buymeacoffee.com/demsking"
"Documentation" = "https://demsking.gitlab.io/bluegate"
"Source" = "https://gitlab.com/demsking/bluegate"
"Tracker" = "https://gitlab.com/demsking/bluegate/-/issues"

[project.scripts]
bluegate = "bluegate.__main__:start"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
  "twine>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bluegate"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
indent-width = 2

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "I001"]

[tool.mypy]
strict = true
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["dbus_next.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bluegate.bluetooth.agent"]
disable_error_code = ["untyped-decorator", "no-untyped-call"]

[[tool.mypy.overrides]]
module = ["bluegate.bluetooth.bus"]
disable_error_code = ["no-untyped-call"]
