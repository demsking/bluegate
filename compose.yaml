name: bluegate-stack

services:
  bluegate-node-a:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluegate-node-a
    ports:
      - "8765:8765"
    environment:
      BLUEGATE_SERVER_HOST: 0.0.0.0
      BLUEGATE_SERVER_PORT: 8765
      BLUEGATE_API_PREFIX: /
      BLUEGATE_CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173

  bluegate-node-b:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bluegate-node-b
    ports:
      - "8766:8765"
    environment:
      BLUEGATE_SERVER_HOST: 0.0.0.0
      BLUEGATE_SERVER_PORT: 8765
      BLUEGATE_API_PREFIX: /
      BLUEGATE_CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5173

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: bluegate-ui
    depends_on:
      - bluegate-node-a
      - bluegate-node-b
    ports:
      - "8080:8080"
    environment:
      UI_NODES_JSON: '[{"id":"node-a","name":"Node A","apiBaseUrl":"http://localhost:8765"},{"id":"node-b","name":"Node B","apiBaseUrl":"http://localhost:8766"}]'
      UI_DEFAULT_NODE_ID: node-a

  inspector:
    image: ghcr.io/modelcontextprotocol/inspector:0.22.0
    ports:
      - "6074:6274"
    environment:
      HOST: 0.0.0.0
      MCP_AUTO_OPEN_ENABLED: false
      DANGEROUSLY_OMIT_AUTH: true
